<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaithTasks - Gestionnaire de projet</title>
    <link rel="stylesheet" href="styletas.css">
</head>
<body>
<header>
    <h1>FaithTasks</h1>
    <div>
    <button id="exportBtn">Exporter</button>
    <button id="importBtn">Importer</button>
    <input type="file" id="importFile" style="display: none;">
    <button id="themeBtn">&#127769</button>
    <button id="addTaskBtn">+ Ajouter une tâche</button></div>
</header>
<div class="filter-bar">
    <button class="filter-btn active" data-filter="toutes">Toutes</button>
    <button class="filter-btn" data-filter="haute"> Haute</button>
    <button class="filter-btn" data-filter="moyenne">Moyenne</button>
    <button class="filter-btn" data-filter="basse">Basse</button>
</div>
<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher une tâche...">
</div>

    <main class="board">
        <div class="column" id="todo">
            <h2>A faire <span class="count">0</span></h2>
            <div class="tasks"></div>
        </div>
        <div class="column" id="doing">
            <h2>En cours <span class="count">0</span></h2>
            <div class="tasks"></div>
        </div>
        <div class="column" id="done">
            <h2>Terminé <span class="count">0</span></h2>
            <div class="tasks"></div>
        </div>
    </main>

    <!--Fenêtre pour ajouter une tâche-->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Nouvelle Tâche</h2>
            <input type="text" id="taskTitle" placeholder="Titre de la tâche">
            <input type="date" id="taskDate">
            <select id="taskPriority">
                <option value="basse">Priorité Basse</option>
                <option value="moyenne" selected>Priorité Moyenne</option>
                <option value="haute">Priorité Haute</option>
            </select> 
            <button id="saveTaskBtn">Enregistrer</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
