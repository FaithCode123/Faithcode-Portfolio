<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculatrice JavaScrip</title>
    <link href="stylecal.css" rel="stylesheet">
  </head>
  <body>
    <h1> Calculatrice JavaScript</h1>
    <input type="number" id="nombre1" placeholder="Premier nombre">
    <input type="number" id="nombre2" placeholder="Deuxième nombre">
    <input type="number" id="montant" placeholder="Montant en FCFA"><br>
    <button onclick="addition()">Addition</button>
    <button onclick="soustraction()">Soustraction</button>
    <button onclick="multiplication()"> Multiplication</button>
    <button onclick="division()">Division</button>
    <button onclick="modulo()">Reste</button>
    <button onclick="puissance()"> Puissance</button>
    <button onclick="effacer()">Effacer</button>
    <button onclick="convertir()">Con en €</button>
    <button onclick="convertir$()">Con en $</button>
    <h2 id="resultat">Résultat :</h2>
    <script src="scriptcal.js"></script>
  </body>
